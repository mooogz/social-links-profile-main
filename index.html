<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center text-center">
  <div class="container rounded-3 p-3 mx-auto mt-auto">
    <img src="./assets/images/avatar-jessica.jpeg" class="rounded-circle mb-4" alt="Jessica Randall profile photo">
    <h1 class="text-white fs-4">Jessica Randall</h1>
    <h2 class="small mb-4">London, United Kingdom</h2>
    <p class="text-white small">"Front-end developer and avid reader."</p>

    
    <ul class="link-container d-flex flex-column align-items-center gap-3 p-0 w-100">
      <li class="rounded"><a href="#">GitHub</a></li>
      <li class="rounded"><a href="#">Frontend Mentor</a></li>
      <li class="rounded"><a href="#">LinkedIn</a></li>
      <li class="rounded"><a href="#">Twitter</a></li>
      <li class="rounded"><a href="#">Instagram</a></li>
      </ul>
  </div>
  <div class="attribution mt-auto">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="http://www.x.com/MegzDev">Megan May</a>.
  </div>
</body>
</html>
